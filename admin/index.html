<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Aura Resource Platform</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
</head>
<body class="theme-dark flex-center-body">

    <div class="login-wrapper">
        <div class="glass-card login-card">
            <!-- Brand Logo Header -->
            <div class="login-header text-center">
                <a href="../index.html" class="brand-logo justify-center">
                    <div class="logo-icon-3d">
                        <span class="core-dot"></span>
                        <span class="orbit-ring"></span>
                    </div>
                    <span class="brand-name" id="brand-name">AURA</span>
                </a>
                <h1 class="login-title">Control Portal</h1>
                <p class="login-subtitle">Sign in to manage platform assets and configurations</p>
            </div>

            <!-- Alert Box for Error/Status Messages -->
            <div id="alert-box" class="alert-box hidden" role="alert"></div>

            <!-- Authentication Form -->
            <form id="admin-login-form" class="login-form">
                <div class="form-group">
                    <label for="email" class="form-label">Admin Email</label>
                    <div class="input-wrapper">
                        <input 
                            type="email" 
                            id="email" 
                            class="form-control" 
                            placeholder="admin@aura.internal" 
                            required 
                            autocomplete="email"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="password" class="form-label">Password</label>
                    </div>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            class="form-control" 
                            placeholder="••••••••••••" 
                            required 
                            autocomplete="current-password"
                        >
                    </div>
                </div>

                <button type="submit" id="btn-login" class="btn btn-primary btn-block btn-glow">
                    <span id="btn-text">Authenticate Session</span>
                    <span id="btn-loader" class="spinner hidden"></span>
                </button>
            </form>

            <!-- Footer links -->
            <div class="login-footer text-center">
                <a href="../index.html" class="back-link">← Return to Public Site</a>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Implementation -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAmhfz7lLOH5H6LcjiiWpJLDTriPRk9V_38",
            authDomain: "aura-resource.firebaseapp.com",
            databaseURL: "https://aura-resource-default-rtdb.firebaseio.com",
            projectId: "aura-resource",
            storageBucket: "aura-resource.firebasestorage.app",
            messagingSenderId: "132836049159",
            appId: "1:132836049159:web:513d4ffbabe801ae80c5a2",
            measurementId: "G-8BJYGLY3SF"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const loginForm = document.getElementById('admin-login-form');
        const alertBox = document.getElementById('alert-box');
        const btnLogin = document.getElementById('btn-login');
        const btnText = document.getElementById('btn-text');
        const btnLoader = document.getElementById('btn-loader');

        // 1. Session Observer: Auto-redirect if already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = "dashboard.html";
            }
        });

        // 2. Load Global Site Settings
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const docSnap = await getDoc(doc(db, "settings", "global"));
                if (docSnap.exists() && docSnap.data().siteName) {
                    document.getElementById('brand-name').textContent = docSnap.data().siteName;
                }
            } catch (err) {
                console.warn("Global settings loading skipped:", err);
            }
        });

        // 3. Handle Form Submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();
            setLoading(true);

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                window.location.href = "dashboard.html";
            } catch (error) {
                setLoading(false);
                displayError(formatAuthError(error.code));
            }
        });

        // Helpers
        function setLoading(isLoading) {
            btnLogin.disabled = isLoading;
            if (isLoading) {
                btnText.textContent = "Authenticating...";
                btnLoader.classList.remove('hidden');
            } else {
                btnText.textContent = "Authenticate Session";
                btnLoader.classList.add('hidden');
            }
        }

        function displayError(msg) {
            alertBox.textContent = msg;
            alertBox.className = "alert-box alert-danger";
            alertBox.classList.remove('hidden');
        }

        function hideAlert() {
            alertBox.classList.add('hidden');
        }

        function formatAuthError(code) {
            switch (code) {
                case 'auth/invalid-credential':
                case 'auth/wrong-password':
                case 'auth/user-not-found':
                    return "Invalid admin email or password credentials.";
                case 'auth/too-many-requests':
                    return "Access blocked due to multiple failed attempts. Try again later.";
                case 'auth/invalid-email':
                    return "Please enter a valid email address.";
                default:
                    return "Authentication failed. Verify network connection.";
            }
        }
    </script>
</body>
</html>
